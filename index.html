:root{--fond:#F6F1E7;--carte:#FFFFFF;--trait:#D9CFBC;--texte:#0A1626;--doux:#4A5568;--or:#D6B77E;--lien:#7A5A1E;--vert:#1E7A46;--orange:#9A5B0B}
html.nuit{--fond:#0A1626;--carte:#111F33;--trait:#2A4063;--texte:#F1ECE2;--doux:#C3CBD6;--lien:#D6B77E;--vert:#7FD6A2;--orange:#F2C46D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte)}
body{font:16px/1.5 'Nyoota Ronde',system-ui,'Segoe UI',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
#ae_tete{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--fond);border-bottom:1px solid var(--trait)}
#ae_tete .marque{font-weight:800;font-size:19px;color:var(--lien)}
#ae_tete .sous{color:var(--doux);font-size:14px}
#ae_tete .esp{flex:1}
.ae-bouton{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--trait);background:var(--carte);color:var(--texte);cursor:pointer}
main{max-width:1366px;margin:0 auto;padding:4px 16px 90px}
.c{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:14px 16px;margin:12px 0}
.mini{color:var(--doux);font-size:14px;margin:4px 0}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;max-width:min(560px,calc(100vw - 32px));background:var(--texte);color:var(--fond);padding:10px 16px;border-radius:12px;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
#ae_connexion .c{max-width:400px;margin:40px auto}
#ae_connexion h1{margin:0 0 4px;font-size:24px;color:var(--lien)}
#ae_connexion label{display:block;margin:14px 0 4px;font-weight:600}
#ae_connexion input{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--trait);background:var(--fond);color:var(--texte);font-size:18px}
#ae_carte p.ae-ok{color:var(--vert);font-weight:600;margin:12px 0 0}
#ae_carte .ae-liens{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:14px}
.ae-lien{background:none;border:0;padding:6px 0;color:var(--lien);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px;text-align:left;min-height:36px}
.ae-fond{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.6);display:flex;align-items:flex-start;overflow:auto;justify-content:center;padding:16px}
.ae-boite{background:var(--carte);color:var(--texte);border:1px solid var(--trait);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.ae-boite h2{margin:0 0 8px;font-size:20px}
.ae-boite .ae-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ae-boite .ae-pr{min-height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--or);color:#0A1626;font-weight:800;cursor:pointer}
.ae-boite .ae-sec{min-height:46px;padding:0 16px;border:1px solid var(--trait);border-radius:10px;background:var(--carte);color:var(--texte);cursor:pointer}
.ae-choix{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--trait);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.ae-choix input{width:20px;height:20px;margin-top:3px}
.ae-choix b{display:block}
.ae-compteur{background:var(--fond);border-radius:10px;padding:8px 12px;margin:6px 0 4px;font-size:15px}
.ae-code{font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--lien);margin:6px 0}
#ae_ok,.ae-envoi{margin-top:16px;min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--or);color:#0A1626;font-weight:800;cursor:pointer}
#ae_ok[disabled],.ae-envoi[disabled]{opacity:.6}
#ae_msg{color:var(--orange);font-weight:600;margin:12px 0 0}
#ae_pied{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px;background:var(--carte);border-top:1px solid var(--trait);font-size:14px;color:var(--doux)}
#ae_pied button{background:none;border:0;color:var(--lien);text-decoration:underline;cursor:pointer;font-size:14px;min-height:36px}
#ae_version{color:var(--doux);font-size:12px;text-align:center;margin:20px 0 0}
/* l'encadré du prix client (maquette v1) */
#v-achat .ae-client{border:1px solid var(--a-trait);border-radius:12px;background:var(--a-carte);padding:6px 12px 8px;margin:8px 0 12px;max-width:760px}
#v-achat table.ae-ct td{border-bottom:1px solid var(--a-trait);padding:8px 6px}
#v-achat table.ae-ct td:first-child{color:var(--a-doux);width:38%}
#v-achat table.ae-ct tr:last-child td{border-bottom:0}
#v-achat .ae-expl{background:var(--a-carte2);border-radius:10px;padding:8px 10px;margin:6px 0}
#v-achat .ae-marge{margin:8px 0 2px}
#v-achat .ae-place{border:1px dashed var(--a-trait);border-radius:8px;padding:1px 8px;white-space:nowrap}
#v-achat .ae-classe{margin:10px 0 4px}

 if(/\s/.test(b)){const p=b.replace(/\s+/g,'.').replace(/[^a-z0-9.]/g,'');return {err:'Pas d\'espace dans le nom : tapez « '+p+' » (un point entre le prénom et l\'initiale).'}}

function aeJour(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
var NegoPont=(function(){
 'use strict';
 const CLE_SESSION=AE_CLE_SESSION,memoire={};
 function lireLS(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(memoire[k]||null)}catch(e){return memoire[k]||null}}
 function ecrireLS(k,v){memoire[k]=v;try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

 function decoderJwt(j){try{return JSON.parse(atob(String(j).split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}

 function reglage(){return clePublique(AE_CLE)?{url:AE_URL,cle:AE_CLE}:null}

 function rpc(fn,args,o){const refus=e=>{if(!(o&&o.metier&&(e.detail||{}).code==='42501'))aeRefus(e);throw e};
  if(!qui())return Promise.reject(erreur('Votre connexion a pris fin : reconnectez-vous.',{code:'AE_SESSION'})).catch(refus);

   .then(r=>r.donnees,refus)}

 function rpcAnonyme(fn,args){return appeler('/rest/v1/rpc/'+encodeURIComponent(fn),{methode:'POST',anonyme:true,entetes:{'Content-Profile':'nego'},corps:args||{}}).then(r=>r.donnees)}
 /* une fonction en ligne appelée sans connexion (equipe-compte : première connexion par code) */
 function enLigneAnonyme(fn,corps){return appeler('/functions/v1/'+encodeURIComponent(fn),{methode:'POST',anonyme:true,corps:corps||{}}).then(r=>r.donnees)}
 /* la session finit le soir même : une session ouverte un autre jour n'existe plus (avis webmaster v1, point 2, recommandation A) */
 function qui(){const s=lireLS(CLE_SESSION);if(!s||!s.access_token)return null;

const v139E=t=>V139.presentation?'<span class="v139-nw v139-masque">••• € HT</span>':'<span class="v139-nw">'+t+' € HT</span>';

function v139Vieux(iso,auj){const d=v139Date(iso);if(!d)return false;auj=auj||v139Auj();let y=auj.getFullYear(),m=auj.getMonth()-6;if(m<0){m+=12;y--}

function v139MoisAn(iso){const d=v139Date(iso);if(!d)return '';const n=V139_MOIS[d.getMonth()];return 'tarif '+(/^[aeiou]/.test(n)?"d'":'de ')+n+' '+d.getFullYear()}

function v139Jours(iso,auj){const d=v139Date(iso);if(!d)return null;auj=auj||new Date();
 return Math.round((new Date(auj.getFullYear(),auj.getMonth(),auj.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)}
const V139_ACC='àáâãäåçèéêëìíîïñòóôõöùúûüýÿœæ',V139_SANS='aaaaaaceeeeiiiinooooouuuuyyoa';

function v139Plat(t){let r='';for(const c of String(t==null?'':t).toLowerCase()){const i=V139_ACC.indexOf(c);r+=i<0?c:V139_SANS[i]}return r.replace(/[^a-z0-9]+/g,' ').trim()}

function v139FamNom(k){const f=V139_FAMILLES.find(x=>x.k===k);return f?f.n:String(k||'')}

function v139Qte(q,u){const brut=String(u||'').trim().toLowerCase(),s=v139Plat(u),pl=+q>1;let w=String(u||'').trim();
 if(/m²|^m2$/.test(brut))w='m²';
 else if(!s||/^(unite|unites|uc|un|u|pc|pce|piece|pieces)$/.test(s))w=pl?'pièces':'pièce';
 else if(/^(m|ml|lm|metre|metres)$/.test(s))w=pl?'mètres':'mètre';
 else if(s==='kg')w='kg';
 else if(/^(l|litre|litres)$/.test(s))w=pl?'litres':'litre';

function v139Seuil(x){if(!x)return '';if(x.qte_min!=null&&x.qte_min!=='')return 'dès '+v139Qte(x.qte_min,x.unite);

/* ---------- notre meilleur prix d'achat : le VRAI minimum (partie D), pas le dernier palier ---------- */
function v139Cands(p){const c=[];
 if(p.prix_reel_ht!=null)c.push({px:+p.prix_reel_ht,k:0,s:0});
 (p.paliers||[]).forEach(x=>{if(x&&x.prix_reel_ht!=null)c.push({px:+x.prix_reel_ht,k:1,s:+(x.qte_min!=null?x.qte_min:(x.montant_min||0)),pal:x})});
 (p.promos||[]).forEach(x=>{if(x&&x.prix_ht!=null)c.push({px:+x.prix_ht,k:2,s:+(x.qte_min||0),promo:x,conf:!!x.frais_a_confirmer})});
 return c.sort((a,b)=>a.px-b.px||a.k-b.k||a.s-b.s)}

function v139QteBase(p){if(p.prix_reel_ht==null)return '';const b=+p.prix_reel_ht;

 return L.length?'dès '+v139Qte(L[0].qte_min,L[0].unite):''}
function v139MeilTxt(p,m){if(!m)return '';
 if(m.k===2){const x=m.promo;return [v139Seuil(x),'promo'+(x.debut&&x.fin?' du '+v139D(x.debut)+' au '+v139D(x.fin):(x.fin?" jusqu'au "+v139D(x.fin):''))].filter(Boolean).join(', ')}
 if(m.k===1)return v139Seuil(m.pal);
 const q=v139QteBase(p),pal=(p.paliers||[]).filter(x=>x&&x.prix_reel_ht!=null);
 if(!pal.length&&!(p.promos||[]).length)return (q?q+', ':'')+'aucun palier ni promo connus';
 if(pal.every(x=>Math.abs(+x.prix_reel_ht-m.px)<1e-9)&&!(p.promos||[]).length)return (q?q+', ':'')+'même prix à toute quantité';

function v139PwEpuise(){return V139.prixWeb==='branche'&&V139.prixRestant!=null&&+V139.prixRestant<=0}

function v139RelJour(r){const d=v139Date(r.le);if(!d)return '';let s=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');

function v139RelDate(r){const d=v139Date(r.le);if(!d)return '';let s=v139RelJour(r);if(/[T ]\d{2}:\d{2}/.test(String(r.le)))s+=' à '+d.getHours()+' h '+String(d.getMinutes()).padStart(2,'0');return s}

function v139Lien(o){const t=esc(o.boutique||'boutique')+(o.vendeur?' · '+esc(o.vendeur):'');

function v139Ecart(p){const L=v139Rel(p),r=L[L.length-1],m=v139Meilleur(p);if(!r||r.rien||!m||!(m.px>0))return null;const o=v139OffresTri(r)[0];if(!o)return null;

function v139Phrase(p){const e=v139Ecart(p);if(!e)return '';const o=e.o;

  +'Calcul : ('+v139E(v139F2(e.t))+' − '+v139E(v139F4(e.b))+') ÷ '+v139E(v139F4(e.b))+' = '+(e.q<0?'−':'')+v139F4(Math.abs(e.q))+', c\'est-à-dire '+e.pc+' %'+(e.q<0?' de moins':'')+' (arrondi). Prix client : '+sens+'.<br>'

function v139CaseClient(p){const L=v139Rel(p),k=esc(v139Cle(p));

 (p.paliers||[]).filter(x=>x&&x.prix_reel_ht!=null&&!(p.prix_reel_ht!=null&&Math.abs(+x.prix_reel_ht-+p.prix_reel_ht)<1e-9))

 (p.promos||[]).filter(x=>x&&x.prix_ht!=null).sort((a,b)=>+b.prix_ht-+a.prix_ht)

function v139NoteFrais(p,m){const pct=p.frais_ajoutes_pct!=null&&+p.frais_ajoutes_pct?+p.frais_ajoutes_pct:null,F=esc(p.fournisseur||'le fournisseur');
